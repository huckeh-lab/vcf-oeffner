<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>VCF-Öffner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root { --bg: #ededee; --ink: #18181a; --ink-2: #55555a; --ink-3: #6b6b70; --line: rgba(24, 24, 26, 0.12); --btn: #18181a; --btn-ink: #fafafa; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141415; --ink: #ededed; --ink-2: #a1a1a6; --ink-3: #85858b; --line: rgba(237, 237, 237, 0.12); --btn: #ededed; --btn-ink: #141415; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/22px Geist, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 480px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 36px; line-height: 40px; overflow-wrap: anywhere; }
p { margin: 0; }
.sub { color: var(--ink-2); }
.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 8px; padding: 0 20px; border-radius: 14px; background: var(--btn); color: var(--btn-ink); font-size: 16px; font-weight: 500; text-decoration: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1); }
.btn:active { transform: scale(0.98); }
.link { color: var(--ink-2); font-size: 14px; text-decoration-color: var(--line); text-underline-offset: 4px; }
.fine { color: var(--ink-3); font-size: 13px; line-height: 20px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Kontakt öffnen</h1>
  <p class="sub" id="msg">Der Kontakt wird vorbereitet …</p>
  <a class="btn" id="open" hidden>Kontakt öffnen</a>
  <p><a class="link" id="file" hidden>Stattdessen als Datei laden</a></p>
  <p class="fine">Diese Seite speichert nichts und sendet nichts. Die Kontaktdaten stehen nur im Link und werden allein in diesem Browser verarbeitet.</p>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var raw = location.hash.slice(1);
  // Drop the contact data from the address bar and from this history entry.
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}

  /*PURE-START*/
  function decodeLink(fragment) {
    if (!fragment || fragment.slice(0, 3) !== "v1.") return null;
    var b64 = fragment.slice(3).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
    if (!/^BEGIN:VCARD\r?\n/.test(text) || !/END:VCARD\r?\n?$/.test(text)) return null;
    return text;
  }
  function vUnesc(s) {
    return s.replace(/\\([\\,;nN])/g, function (m, c) { return c === "n" || c === "N" ? " " : c; });
  }
  function summary(text) {
    var names = [];
    var re = /^FN:(.*)$/gm, m;
    while ((m = re.exec(text))) names.push(vUnesc(m[1].replace(/\r$/, "")).trim());
    return names;
  }
  function fileName(names) {
    var base = names.length === 1 ? names[0] : "Visitenkarten";
    base = base.normalize("NFKD").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60);
    return (base || "Kontakt") + ".vcf";
  }
  /*PURE-END*/

  if (!raw) { $("msg").textContent = "Im Link steht kein Kontakt. Diese Seite wird von Contact Control aufgerufen."; return; }
  if (raw.length > 400000) { $("msg").textContent = "Der Link ist zu lang. Bitte weniger Karten auf einmal öffnen."; return; }
  var text = null;
  try { text = decodeLink(raw); } catch (e) { text = null; }
  if (!text) { $("msg").textContent = "Der Link ist unvollständig oder beschädigt. Bitte in Contact Control erneut auf „In Kontakte“ tippen."; return; }

  var names = summary(text);
  var many = names.length > 1;
  $("title").textContent = many ? names.length + " Kontakte" : (names[0] || "Kontakt");
  $("msg").textContent = many
    ? names.slice(0, 6).join(", ") + (names.length > 6 ? " und " + (names.length - 6) + " weitere" : "")
    : "Öffnet die Kontaktkarte. Dort „Neuen Kontakt erstellen“ wählen.";

  var url = URL.createObjectURL(new Blob([text], { type: "text/vcard" }));
  var open = $("open"), file = $("file");
  open.textContent = many ? "Kontakte öffnen" : "Kontakt öffnen";
  open.href = url; open.hidden = false;
  file.href = url; file.setAttribute("download", fileName(names)); file.hidden = false;

  // On iPhone and iPad the contact card can be shown right away; elsewhere wait for the tap.
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) setTimeout(function () { location.href = url; }, 200);
})();
</script>
</body>
</html>
